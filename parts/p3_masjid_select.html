<!-- ============================================================
     PAGE: MASJID DIRECTORY, SEARCH & ENROLLMENT
     ============================================================ -->
<div class="page" id="page-masjid-select">
  <div class="min-h-screen bg-slate-50 flex flex-col">
    <!-- Top Header -->
    <div class="bg-emerald-800 text-white px-5 py-4 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <span class="text-2xl ornament">☪</span>
        <div>
          <h1 class="font-extrabold text-base tracking-wide">WAJBA - THE MEAL</h1>
          <p class="text-emerald-200 text-xs" id="masjid-select-user-greeting">Logged in as...</p>
        </div>
      </div>
      <button onclick="logout()" class="btn bg-white/10 hover:bg-white/20 text-white text-xs py-1.5 px-3 rounded-lg border border-white/20 flex items-center gap-1.5">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        Sign Out
      </button>
    </div>

    <div class="max-w-2xl w-full mx-auto p-4 sm:p-6 flex-1 space-y-5">
      
      <!-- Search Box Card -->
      <div class="card border-2 border-emerald-100 shadow-sm">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center font-bold text-lg">
            🔍
          </div>
          <div>
            <h2 class="font-bold text-slate-800 text-base">Find Your Masjid</h2>
            <p class="text-slate-500 text-xs">Enter unique <strong>Masjid ID</strong> (e.g. <span class="font-mono font-semibold text-emerald-700">MSJ-7821</span>) or Masjid Name</p>
          </div>
        </div>
        <div class="flex gap-2">
          <input type="text" id="masjid-search-input" oninput="handleMasjidSearch()" class="input-field flex-1 font-medium text-sm" placeholder="Search by name or enter Masjid ID...">
          <button onclick="handleDirectMasjidIdSearch()" class="btn btn-primary px-4 text-xs font-bold whitespace-nowrap">
            Search
          </button>
        </div>
      </div>

      <!-- Action Card: Enroll New Masjid (Admin) -->
      <div class="p-5 rounded-2xl bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-800 text-white flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-md">
        <div>
          <span class="bg-white/20 text-emerald-100 text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">For Admin</span>
          <h3 class="font-bold text-base mt-1">Enroll a New Masjid</h3>
          <p class="text-xs text-emerald-100 max-w-sm mt-0.5">Register your Mahal Jama'ath with your email. A unique <strong>Masjid ID</strong> will be generated for your community.</p>
        </div>
        <button onclick="openEnrollMasjidModal()" class="btn bg-white text-emerald-800 hover:bg-emerald-50 text-xs font-bold py-2.5 px-4 shadow-sm self-start sm:self-center whitespace-nowrap">
          + Enroll Masjid
        </button>
      </div>

      <!-- Section: My Masjids -->
      <div>
        <h3 class="font-bold text-slate-700 text-sm mb-2.5 flex items-center gap-2">
          <span>🕌</span> My Enrolled Masjids
        </h3>
        <div id="my-masjids-list" class="space-y-3">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- Section: All Available Masjids Directory -->
      <div>
        <h3 class="font-bold text-slate-700 text-sm mb-2.5 flex items-center gap-2">
          <span>📋</span> All Registered Masjids
        </h3>
        <div id="all-masjids-list" class="space-y-3">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </div>
  </div>
</div>
